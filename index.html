<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF2C2C" />
    <title>Chicken LessFille Solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-background text-ink antialiased">
    <header class="sticky top-0 z-40 border-b border-border bg-surface/95 backdrop-blur-sm shadow-[0_1px_3px_rgba(18,20,22,0.06)]">
      <div class="ui-container flex flex-col gap-2 py-2.5 md:min-h-[64px] md:flex-row md:items-center md:justify-between md:gap-3 md:py-2">
        <div class="flex min-w-0 items-center justify-between gap-2 md:contents">
          <a
            href="./"
            class="inline-flex min-w-0 flex-1 md:flex-initial items-center gap-2 text-sm sm:text-base font-extrabold tracking-tight text-ink md:order-1"
            aria-label="Home"
          >
            <span class="h-2.5 w-2.5 shrink-0 rounded-full bg-primary" aria-hidden="true"></span>
            <span id="brand-name-header" class="truncate"></span>
          </a>

          <a
            href="./cart/"
            class="inline-flex min-h-[38px] sm:min-h-[42px] shrink-0 items-center gap-1.5 sm:gap-2 rounded-full bg-ink px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-bold text-white transition-colors hover:bg-primary group md:order-4"
          >
            <span data-i18n="nav.cart">Keranjang</span>
            <span
              id="header-cart-badge"
              class="inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-primary px-1.5 text-[11px] font-extrabold text-white transition-colors group-hover:bg-white group-hover:text-primary tabular-nums"
            >0</span>
          </a>
        </div>

        <nav class="hidden lg:flex items-center gap-1 md:order-2" aria-label="Main navigation">
          <a href="#menu" class="inline-flex min-h-[40px] items-center rounded-full px-3.5 text-sm font-semibold text-ink-secondary transition-colors hover:bg-background hover:text-ink" data-i18n="nav.menu">Menu</a>
          <a href="#about" class="inline-flex min-h-[40px] items-center rounded-full px-3.5 text-sm font-semibold text-ink-secondary transition-colors hover:bg-background hover:text-ink" data-i18n="nav.about">Profil</a>
          <a href="#branches" class="inline-flex min-h-[40px] items-center rounded-full px-3.5 text-sm font-semibold text-ink-secondary transition-colors hover:bg-background hover:text-ink" data-i18n="nav.branches">Cabang</a>
          <a href="#contact" class="inline-flex min-h-[40px] items-center rounded-full px-3.5 text-sm font-semibold text-ink-secondary transition-colors hover:bg-background hover:text-ink" data-i18n="nav.contact">Kontak</a>
        </nav>

        <div
          id="lang-toggle"
          class="ui-lang-switch w-full md:order-3 md:w-auto"
        ></div>
      </div>
    </header>

    <nav class="border-b border-border bg-surface lg:hidden" aria-label="Quick section navigation">
      <div class="ui-container flex items-center gap-1.5 overflow-x-auto py-2 no-scrollbar">
        <a href="#menu" class="inline-flex min-h-[38px] shrink-0 items-center rounded-full bg-surface-muted border border-border px-3.5 text-xs font-bold text-ink-secondary hover:border-primary hover:text-primary" data-i18n="nav.menu">Menu</a>
        <a href="#about" class="inline-flex min-h-[38px] shrink-0 items-center rounded-full bg-surface-muted border border-border px-3.5 text-xs font-bold text-ink-secondary hover:border-primary hover:text-primary" data-i18n="nav.about">Profil</a>
        <a href="#branches" class="inline-flex min-h-[38px] shrink-0 items-center rounded-full bg-surface-muted border border-border px-3.5 text-xs font-bold text-ink-secondary hover:border-primary hover:text-primary" data-i18n="nav.branches">Cabang</a>
        <a href="#contact" class="inline-flex min-h-[38px] shrink-0 items-center rounded-full bg-surface-muted border border-border px-3.5 text-xs font-bold text-ink-secondary hover:border-primary hover:text-primary" data-i18n="nav.contact">Kontak</a>
      </div>
    </nav>

    <main>
      <section class="pt-4 pb-3 sm:pt-6 sm:pb-4" aria-labelledby="hero-title">
        <div class="ui-container">
          <div class="overflow-hidden rounded-2xl border border-black/10 bg-dark-canvas shadow-[0_6px_20px_rgba(18,20,22,0.1)] lg:relative lg:flex lg:min-h-[430px] xl:min-h-[470px] lg:items-center">
            <div class="aspect-[16/9] w-full overflow-hidden bg-dark-canvas lg:absolute lg:inset-0 lg:aspect-auto lg:h-full">
              <img
                src="./assets/hero-banner.jpg"
                class="h-full w-full object-cover object-center lg:object-right"
                data-i18n-alt="hero.imageAlt"
                alt=""
                fetchpriority="high"
              />
              <div
                class="hidden lg:block lg:absolute lg:inset-y-0 lg:left-0 lg:w-[54%] lg:bg-dark-canvas/75 lg:[mask-image:linear-gradient(to_right,black_68%,transparent)]"
                aria-hidden="true"
              ></div>
            </div>

            <div class="relative z-10 p-5 sm:p-7 lg:max-w-[520px] lg:px-10 lg:py-12 text-white">
              <span
                class="mb-3 inline-flex rounded-lg bg-primary px-3 py-1 text-[11px] font-extrabold uppercase tracking-wider text-white leading-snug"
                data-i18n="hero.eyebrow"
              ></span>
              <h1
                id="hero-title"
                class="mb-3 text-2xl sm:text-3xl lg:text-5xl font-extrabold leading-[1.12] tracking-tight text-white"
              ></h1>
              <p
                id="hero-lead"
                class="mb-5 text-sm sm:text-base leading-relaxed text-[#E2E8E6]"
              ></p>
              <div class="flex flex-col sm:flex-row gap-2.5">
                <a href="#menu" class="ui-btn ui-btn-primary w-full sm:w-auto" data-i18n="hero.ctaMenu"></a>
                <a href="#branches" class="ui-btn ui-btn-outline-light w-full sm:w-auto" data-i18n="hero.ctaBranches"></a>
              </div>
            </div>
          </div>

          <div
            id="highlights-strip"
            class="mt-3.5 grid grid-cols-1 gap-3 sm:grid-cols-3"
            aria-live="polite"
          ></div>
        </div>
      </section>

      <section id="menu" class="py-7 sm:py-10" aria-labelledby="menu-section-title">
        <div class="ui-container">
          <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p class="mb-1 text-xs font-extrabold uppercase tracking-wider text-primary" data-i18n="menu.sectionEyebrow"></p>
              <h2 id="menu-section-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-ink" data-i18n="menu.sectionTitle"></h2>
            </div>
            <div class="w-full sm:w-72 sm:shrink-0">
              <label for="menu-search" class="sr-only" data-i18n="menu.searchLabel"></label>
              <input
                id="menu-search"
                type="search"
                class="ui-input rounded-full"
                data-i18n-placeholder="menu.searchPlaceholder"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="mb-5 bg-background/95 py-2.5 backdrop-blur-sm md:sticky md:top-16 md:z-20">
            <div
              id="category-tabs"
              class="flex items-center gap-2 overflow-x-auto pb-1 lg:flex-wrap lg:overflow-visible lg:pb-0 no-scrollbar"
              role="tablist"
            ></div>
          </div>

          <div id="menu-container" aria-live="polite">
            <div class="ui-card p-7 text-center text-sm text-ink-secondary" data-i18n="menu.loading"></div>
          </div>
        </div>
      </section>

      <section id="about" class="py-7 sm:py-10" aria-labelledby="about-section-title">
        <div class="ui-container">
          <div class="mb-5">
            <p class="mb-1 text-xs font-extrabold uppercase tracking-wider text-primary" data-i18n="business.sectionEyebrow"></p>
            <h2 id="about-section-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-ink" data-i18n="business.sectionTitle"></h2>
          </div>
          <div id="business-container" class="grid grid-cols-1 gap-4 lg:grid-cols-12"></div>
        </div>
      </section>

      <section id="branches" class="py-7 sm:py-10" aria-labelledby="branches-section-title">
        <div class="ui-container">
          <div class="mb-5">
            <p class="mb-1 text-xs font-extrabold uppercase tracking-wider text-primary" data-i18n="branches.sectionEyebrow"></p>
            <h2 id="branches-section-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-ink" data-i18n="branches.sectionTitle"></h2>
          </div>
          <div id="branches-container" class="grid grid-cols-1 gap-4 md:grid-cols-3"></div>
        </div>
      </section>

      <section id="contact" class="py-7 sm:py-10" aria-labelledby="contact-section-title">
        <div class="ui-container">
          <div class="mb-5">
            <p class="mb-1 text-xs font-extrabold uppercase tracking-wider text-primary" data-i18n="contact.sectionEyebrow"></p>
            <h2 id="contact-section-title" class="text-xl sm:text-2xl lg:text-3xl font-extrabold tracking-tight text-ink" data-i18n="contact.sectionTitle"></h2>
          </div>
          <div id="contact-container" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5"></div>
        </div>
      </section>
    </main>

    <div
      id="floating-cart"
      class="pointer-events-none fixed inset-x-0 bottom-3 z-50 px-3 pb-[env(safe-area-inset-bottom)]"
      hidden
    >
      <div class="pointer-events-auto mx-auto flex max-w-2xl items-center justify-between gap-3 rounded-full bg-dark-canvas py-2 pl-4 pr-2 sm:pl-6 text-white shadow-[0_10px_28px_rgba(18,20,22,0.25)]">
        <div class="flex min-w-0 flex-wrap items-baseline gap-x-2.5 gap-y-0.5">
          <span id="floating-cart-count" class="text-xs sm:text-sm font-bold text-[#D1D9D7]"></span>
          <span id="floating-cart-total" class="text-sm sm:text-base font-extrabold text-white tabular-nums"></span>
        </div>
        <a
          href="./cart/"
          class="ui-btn ui-btn-primary shrink-0 px-4 sm:px-5 text-xs sm:text-sm"
          data-i18n="floatingCart.viewCart"
        ></a>
      </div>
    </div>

    <footer class="mt-6 border-t border-border bg-surface pt-6 pb-24">
      <div class="ui-container flex flex-col gap-1.5 sm:flex-row sm:items-center sm:justify-between text-xs sm:text-sm text-ink-muted">
        <strong id="brand-name-footer" class="text-ink"></strong>
        <span data-i18n="footer.rights"></span>
      </div>
    </footer>

    <script type="module" src="./js/home.js"></script>
  </body>
</html>
