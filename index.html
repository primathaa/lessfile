<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken LessFille Solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="./" class="brand-link" aria-label="Home">
          <span class="brand-dot" aria-hidden="true"></span>
          <span id="brand-name-header"></span>
        </a>

        <nav class="header-nav" aria-label="Main navigation">
          <a href="#menu" class="nav-link" data-i18n="nav.menu">Menu</a>
          <a href="#about" class="nav-link" data-i18n="nav.about">Profil</a>
          <a href="#branches" class="nav-link" data-i18n="nav.branches">Cabang</a>
          <a href="#contact" class="nav-link" data-i18n="nav.contact">Kontak</a>
        </nav>

        <div class="header-actions">
          <div id="lang-toggle" class="lang-switch"></div>
          <a href="./cart/" class="cart-nav-btn">
            <span data-i18n="nav.cart">Keranjang</span>
            <span id="header-cart-badge" class="cart-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="hero-section" aria-labelledby="hero-title">
        <div class="container">
          <div class="hero-banner">
            <div class="hero-media">
              <img
                src="./assets/hero-banner.jpg"
                class="hero-img"
                data-i18n-alt="hero.imageAlt"
                alt=""
                fetchpriority="high"
              />
              <div class="hero-scrim" aria-hidden="true"></div>
            </div>

            <div class="hero-content">
              <span class="hero-eyebrow" data-i18n="hero.eyebrow"></span>
              <h1 id="hero-title" class="hero-title"></h1>
              <p id="hero-lead" class="hero-lead"></p>
              <div class="hero-actions">
                <a href="#menu" class="btn btn-primary" data-i18n="hero.ctaMenu"></a>
                <a href="#branches" class="btn btn-outline-light" data-i18n="hero.ctaBranches"></a>
              </div>
            </div>
          </div>

          <div id="highlights-strip" class="highlights-strip" aria-live="polite"></div>
        </div>
      </section>

      <section id="menu" class="page-section" aria-labelledby="menu-section-title">
        <div class="container">
          <div class="section-header">
            <div>
              <p class="section-eyebrow" data-i18n="menu.sectionEyebrow"></p>
              <h2 id="menu-section-title" class="section-title" data-i18n="menu.sectionTitle"></h2>
            </div>
          </div>

          <div class="menu-toolbar">
            <div class="menu-toolbar-top">
              <div id="category-tabs" class="category-tabs" role="tablist"></div>
              <div class="search-box">
                <label for="menu-search" class="sr-only" data-i18n="menu.searchLabel"></label>
                <input
                  id="menu-search"
                  type="search"
                  class="search-input"
                  data-i18n-placeholder="menu.searchPlaceholder"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>

          <div id="menu-container" aria-live="polite">
            <div class="status-box" data-i18n="menu.loading"></div>
          </div>
        </div>
      </section>

      <section id="about" class="page-section" aria-labelledby="about-section-title">
        <div class="container">
          <div class="section-header">
            <div>
              <p class="section-eyebrow" data-i18n="business.sectionEyebrow"></p>
              <h2 id="about-section-title" class="section-title" data-i18n="business.sectionTitle"></h2>
            </div>
          </div>
          <div id="business-container" class="info-grid"></div>
        </div>
      </section>

      <section id="branches" class="page-section" aria-labelledby="branches-section-title">
        <div class="container">
          <div class="section-header">
            <div>
              <p class="section-eyebrow" data-i18n="branches.sectionEyebrow"></p>
              <h2 id="branches-section-title" class="section-title" data-i18n="branches.sectionTitle"></h2>
            </div>
          </div>
          <div id="branches-container" class="branches-grid"></div>
        </div>
      </section>

      <section id="contact" class="page-section" aria-labelledby="contact-section-title">
        <div class="container">
          <div class="section-header">
            <div>
              <p class="section-eyebrow" data-i18n="contact.sectionEyebrow"></p>
              <h2 id="contact-section-title" class="section-title" data-i18n="contact.sectionTitle"></h2>
            </div>
          </div>
          <div id="contact-container" class="contact-grid"></div>
        </div>
      </section>
    </main>

    <div id="floating-cart" class="floating-cart-wrap" hidden>
      <div class="floating-cart-bar">
        <div class="floating-cart-meta">
          <span id="floating-cart-count" class="floating-cart-count"></span>
          <span id="floating-cart-total" class="floating-cart-total"></span>
        </div>
        <a href="./cart/" class="btn btn-primary" data-i18n="floatingCart.viewCart"></a>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <strong id="brand-name-footer"></strong>
        <span data-i18n="footer.rights"></span>
      </div>
    </footer>

    <script type="module" src="./js/home.js"></script>
  </body>
</html>
