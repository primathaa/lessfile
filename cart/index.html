<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Chicken LessFille Solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <div class="header-actions">
          <a href="../" class="back-link">
            <span aria-hidden="true">&larr;</span>
            <span data-i18n="nav.backToMenu"></span>
          </a>
          <a href="../" class="brand-link">
            <span class="brand-dot" aria-hidden="true"></span>
            <span id="brand-name-header"></span>
          </a>
        </div>

        <div class="header-actions">
          <div id="lang-toggle" class="lang-switch"></div>
        </div>
      </div>
    </header>

    <main class="cart-page-main">
      <div class="container">
        <div class="section-header">
          <div>
            <p class="section-eyebrow" data-i18n="cart.eyebrow"></p>
            <h1 class="section-title" data-i18n="cart.title"></h1>
            <p class="card-text" data-i18n="cart.subtitle"></p>
          </div>
        </div>

        <div id="cart-root" class="cart-layout" aria-live="polite">
          <div class="card">
            <div class="cart-items-header">
              <h2 class="card-title" data-i18n="cart.itemsTitle" style="margin: 0"></h2>
              <button
                id="clear-cart-btn"
                type="button"
                class="btn btn-ghost-danger"
                data-i18n="cart.clearCart"
                hidden
              ></button>
            </div>
            <div id="cart-items-container"></div>
          </div>

          <aside id="checkout-card" class="card checkout-card">
            <h2 class="card-title" data-i18n="cart.checkoutTitle"></h2>

            <form id="checkout-form" novalidate>
              <div class="form-group">
                <label for="branch-select" class="form-label" data-i18n="cart.branchLabel"></label>
                <select id="branch-select" class="form-control" required></select>
              </div>

              <div class="form-group">
                <label for="customer-name" class="form-label" data-i18n="cart.nameLabel"></label>
                <input
                  id="customer-name"
                  type="text"
                  class="form-control"
                  data-i18n-placeholder="cart.namePlaceholder"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="form-group">
                <span class="form-label" data-i18n="cart.orderTypeLabel"></span>
                <div class="radio-row">
                  <label class="radio-chip">
                    <input type="radio" name="orderType" value="dineIn" checked />
                    <span data-i18n="cart.dineIn"></span>
                  </label>
                  <label class="radio-chip">
                    <input type="radio" name="orderType" value="takeAway" />
                    <span data-i18n="cart.takeAway"></span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <span class="form-label" data-i18n="cart.paymentLabel"></span>
                <div class="radio-row">
                  <label class="radio-chip">
                    <input type="radio" name="paymentMethod" value="paymentCash" checked />
                    <span data-i18n="cart.paymentCash"></span>
                  </label>
                  <label class="radio-chip">
                    <input type="radio" name="paymentMethod" value="paymentEmoney" />
                    <span data-i18n="cart.paymentEmoney"></span>
                  </label>
                </div>
              </div>

              <div class="form-group">
                <label for="order-notes" class="form-label" data-i18n="cart.orderNotesLabel"></label>
                <textarea
                  id="order-notes"
                  rows="2"
                  class="form-control"
                  data-i18n-placeholder="cart.orderNotesPlaceholder"
                ></textarea>
              </div>

              <div class="summary-rows">
                <div class="summary-row">
                  <span data-i18n="cart.totalItems"></span>
                  <strong id="summary-count">0</strong>
                </div>
                <div class="summary-row">
                  <span data-i18n="cart.subtotal"></span>
                  <strong id="summary-subtotal">Rp 0</strong>
                </div>
                <div class="summary-row is-total">
                  <span data-i18n="cart.total"></span>
                  <strong id="summary-total">Rp 0</strong>
                </div>
              </div>

              <p id="form-feedback" class="form-feedback" hidden></p>

              <div class="checkout-actions">
                <button id="whatsapp-submit-btn" type="submit" class="btn btn-primary" data-i18n="cart.sendWhatsApp"></button>
                <button id="copy-summary-btn" type="button" class="btn btn-outline" data-i18n="cart.copySummary"></button>
              </div>

              <p class="payment-hint" data-i18n="cart.paymentNote"></p>
            </form>
          </aside>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <strong id="brand-name-footer"></strong>
        <span data-i18n="footer.rights"></span>
      </div>
    </footer>

    <script type="module" src="../js/cart.js"></script>
  </body>
</html>
