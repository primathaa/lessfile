<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF2C2C" />
    <title>Cart — Chicken LessFille Solo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-bg-body text-text-primary antialiased">
    <header class="sticky top-0 z-40 border-b border-border-default bg-bg-surface/95 backdrop-blur-md">
      <div class="mx-auto flex max-w-[1140px] items-center justify-between gap-2 px-3.5 py-2 sm:px-5 md:min-h-[64px] lg:px-6">
        <div class="flex min-w-0 items-center gap-2.5">
          <a href="../#menu" class="flex min-w-0 items-center gap-2">
            <span
              class="inline-flex h-7 w-7 sm:h-8 sm:w-8 shrink-0 items-center justify-center rounded-[6px] sm:rounded-[var(--radius-element)] bg-accent text-[11px] sm:text-xs font-extrabold text-on-accent"
              aria-hidden="true"
              >LF</span
            >
            <div class="min-w-0">
              <div id="brand-name-header" class="truncate text-xs sm:text-base font-extrabold text-text-primary"></div>
              <div class="text-[10px] sm:text-[11px] font-medium text-text-secondary" data-i18n="shell.subtitle">Astryx Ordering</div>
            </div>
          </a>

          <a
            href="../#menu"
            class="ax-btn ax-btn-outline hidden sm:inline-flex shrink-0 text-xs"
          >
            <span aria-hidden="true">&larr;</span>
            <span data-i18n="nav.backToMenu"></span>
          </a>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 sm:gap-2">
          <div id="lang-toggle" class="ax-segmented"></div>
          <button
            type="button"
            data-theme-toggle
            data-theme-compact
            class="ax-btn ax-btn-muted min-h-[32px] px-2.5 py-1 text-[11px] font-extrabold lg:hidden"
          >
            <span data-theme-label>Light</span>
          </button>
          <button
            type="button"
            data-theme-toggle
            class="ax-btn ax-btn-outline hidden lg:inline-flex shrink-0 text-xs"
          >
            <span data-theme-label>Light Mode</span>
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-[1140px] px-3.5 py-6 sm:px-5 sm:py-8 lg:px-6 pb-20">
      <div class="mb-5">
        <p class="ax-caption text-text-accent mb-1" data-i18n="cart.eyebrow"></p>
        <h1 class="ax-heading-1 text-text-primary" data-i18n="cart.title"></h1>
        <p class="mt-1 text-xs sm:text-sm text-text-secondary max-w-[60ch]" data-i18n="cart.subtitle"></p>
      </div>

      <div
        id="cart-root"
        class="grid grid-cols-1 items-start gap-5 lg:grid-cols-[minmax(0,1.35fr)_minmax(0,0.95fr)]"
        aria-live="polite"
      >
        <section class="ax-card-padded">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-2 border-b border-border-subtle pb-3">
            <h2 class="text-sm sm:text-base font-extrabold text-text-primary" data-i18n="cart.itemsTitle"></h2>
            <button
              id="clear-cart-btn"
              type="button"
              class="ax-btn ax-btn-soft min-h-[34px] px-3 py-1 text-xs"
              data-i18n="cart.clearCart"
              hidden
            ></button>
          </div>
          <div id="cart-items-container"></div>
        </section>

        <aside id="checkout-card" class="ax-card-padded lg:sticky lg:top-20">
          <h2 class="mb-4 text-sm sm:text-base font-extrabold text-text-primary" data-i18n="cart.checkoutTitle"></h2>

          <form id="checkout-form" class="space-y-4" novalidate>
            <div class="space-y-1.5">
              <label for="branch-select" class="block text-xs font-extrabold text-text-primary" data-i18n="cart.branchLabel"></label>
              <select id="branch-select" class="ax-select" required></select>
              <p
                id="branch-address-preview"
                class="rounded-[var(--radius-element)] border border-border-subtle bg-bg-muted px-3 py-2 text-xs leading-relaxed text-text-secondary"
                hidden
              ></p>
            </div>

            <div class="space-y-1.5">
              <label for="customer-name" class="block text-xs font-extrabold text-text-primary" data-i18n="cart.nameLabel"></label>
              <input
                id="customer-name"
                type="text"
                class="ax-input"
                data-i18n-placeholder="cart.namePlaceholder"
                autocomplete="name"
                required
              />
            </div>

            <div class="space-y-1.5">
              <span class="block text-xs font-extrabold text-text-primary" data-i18n="cart.orderTypeLabel"></span>
              <div class="grid grid-cols-2 gap-2">
                <label class="ax-radio-card">
                  <input type="radio" name="orderType" value="takeAway" checked />
                  <span class="leading-snug" data-i18n="cart.takeAway"></span>
                </label>
                <label class="ax-radio-card">
                  <input type="radio" name="orderType" value="dineIn" />
                  <span class="leading-snug" data-i18n="cart.dineIn"></span>
                </label>
              </div>
            </div>

            <div class="space-y-1.5">
              <span class="block text-xs font-extrabold text-text-primary" data-i18n="cart.paymentLabel"></span>
              <div class="grid grid-cols-1 gap-2 sm:grid-cols-2">
                <label class="ax-radio-card">
                  <input type="radio" name="paymentMethod" value="paymentCash" checked />
                  <span class="leading-snug" data-i18n="cart.paymentCash"></span>
                </label>
                <label class="ax-radio-card">
                  <input type="radio" name="paymentMethod" value="paymentEmoney" />
                  <span class="leading-snug" data-i18n="cart.paymentEmoney"></span>
                </label>
              </div>
            </div>

            <div class="space-y-1.5">
              <label for="order-notes" class="block text-xs font-extrabold text-text-primary" data-i18n="cart.orderNotesLabel"></label>
              <textarea
                id="order-notes"
                rows="2"
                class="ax-textarea"
                data-i18n-placeholder="cart.orderNotesPlaceholder"
              ></textarea>
            </div>

            <div class="space-y-2 border-y border-border-subtle py-3.5 text-xs sm:text-sm">
              <div class="flex items-center justify-between text-text-secondary">
                <span data-i18n="cart.totalItems"></span>
                <strong id="summary-count" class="font-bold text-text-primary tabular-nums">0</strong>
              </div>
              <div class="flex items-center justify-between text-text-secondary">
                <span data-i18n="cart.subtotal"></span>
                <strong id="summary-subtotal" class="font-bold text-text-primary tabular-nums">Rp 0</strong>
              </div>
              <div class="flex items-center justify-between text-text-secondary">
                <span data-i18n="shell.serviceFee"></span>
                <strong class="font-bold text-success" data-i18n="shell.free"></strong>
              </div>
              <div class="flex items-center justify-between pt-1 text-sm sm:text-base font-extrabold text-text-primary">
                <span data-i18n="cart.total"></span>
                <strong id="summary-total" class="text-base sm:text-lg text-text-accent tabular-nums">Rp 0</strong>
              </div>
            </div>

            <p id="form-feedback" class="rounded-[var(--radius-element)] border px-3 py-2.5 text-xs font-semibold" hidden></p>

            <div class="flex flex-col gap-2.5">
              <button
                id="whatsapp-submit-btn"
                type="submit"
                class="ax-btn-lg ax-btn-primary w-full"
                data-i18n="cart.sendWhatsApp"
              ></button>
              <button
                id="copy-summary-btn"
                type="button"
                class="ax-btn ax-btn-outline w-full"
                data-i18n="cart.copySummary"
              ></button>
            </div>

            <p class="text-xs leading-relaxed text-text-secondary" data-i18n="cart.paymentNote"></p>
          </form>
        </aside>
      </div>
    </main>

    <footer class="mt-8 border-t border-border-default bg-bg-surface pt-6 pb-24 lg:pb-6">
      <div class="mx-auto max-w-[1140px] px-3.5 sm:px-5 lg:px-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between text-xs text-text-secondary">
        <strong id="brand-name-footer" class="text-text-primary"></strong>
        <span data-i18n="footer.rights"></span>
      </div>
    </footer>

    <!-- Astryx Mobile Bottom Navigation Bar (< 1024px, Cart tab active) -->
    <div class="ax-bnav-wrap" role="navigation" aria-label="Mobile bottom navigation">
      <nav class="ax-bnav">
        <a href="../#menu" class="ax-bnav-item">
          <span class="ax-bnav-icon" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11h18M5 11V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4M4 15h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2Zm2 4h12" />
            </svg>
          </span>
          <span class="ax-bnav-label" data-i18n="nav.menu">Menu</span>
        </a>

        <a href="../#hero-promo" class="ax-bnav-item">
          <span class="ax-bnav-icon" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2z" />
            </svg>
          </span>
          <span class="ax-bnav-label" data-i18n="nav.promo">Paket</span>
        </a>

        <a href="./" class="ax-bnav-item is-active" aria-current="page">
          <span class="ax-bnav-icon" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
          </span>
          <span class="ax-bnav-label" data-i18n="nav.cart">Keranjang</span>
        </a>

        <a href="../#branches" class="ax-bnav-item">
          <span class="ax-bnav-icon" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
          </span>
          <span class="ax-bnav-label" data-i18n="nav.branches">Cabang</span>
        </a>

        <a href="../#about" class="ax-bnav-item">
          <span class="ax-bnav-icon" aria-hidden="true">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <span class="ax-bnav-label" data-i18n="nav.about">Profil</span>
        </a>
      </nav>
    </div>

    <script type="module" src="../js/cart.js"></script>
  </body>
</html>
